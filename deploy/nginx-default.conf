server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/markdown;

    # Markdown is an alternative representation of the canonical HTML article.
    location ~ ^(?<article_path>/(?:en/)?(?:blogs|ai-native-swe)/.+/)index\.md$ {
        types { }
        default_type text/markdown;
        add_header Link '<https://onurozkir.com$article_path>; rel="canonical"';
        try_files $uri =404;
    }

    location ~ ^/(?:en/)?llms(?:-full)?\.txt$ {
        types { }
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
